const g=document.getElementById('g'),ov=document.getElementById('ov');
C.forEach((c,i)=>{const b=document.createElement('button');b.className='card';b.innerHTML=`<img src="${c.img}" alt=""><div class="l"><span class="num">${c.n}</span><div><b>${c.t}</b><span class="k">${c.k}</span></div></div>`;b.onclick=()=>open_(i);g.appendChild(b)});
function open_(i){const c=C[i];pi.src=c.img;pt.textContent=c.n+'. '+c.t;pk.textContent=c.k;pb.innerHTML=c.lore.map(t=>`<p>${t}</p>`).join('');ov.classList.add('o');cl.focus()}
function close_(){ov.classList.remove('o')}
cl.onclick=close_;ov.onclick=e=>{if(e.target===ov)close_()};document.onkeydown=e=>{if(e.key==='Escape')close_()};
</script></body></html>
