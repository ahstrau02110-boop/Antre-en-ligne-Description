<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Antre en Ligne - La Numériteam</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Roboto,system-ui,sans-serif;background:linear-gradient(to top,#8A2B76 0%,#7A3A72 15%,#6B4A6E 30%,#5C5A6A 45%,#5C7A66 62%,#44614F 80%,#2E4535 100%);background-attachment:fixed;color:#111;min-height:100vh}
header{text-align:center;padding:32px 16px 8px}
h1{margin:0;font-size:28px;font-weight:500;display:inline-block;position:relative}h1 em{position:absolute;right:-92px;top:-14px;transform:rotate(8deg);background:#f2d16b;color:#2E4535;font-size:12px;font-style:normal;font-weight:500;padding:3px 8px;border-radius:4px;white-space:nowrap}h1:after{content:'';display:block;height:4px;margin-top:4px;background:#f2d16b;border-radius:2px;transform:rotate(-.8deg)}
header{color:#fff}header p{margin:6px 0 0;color:#e6ece8;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;max-width:720px;margin:24px auto;padding:0 16px}
.card{background:#fff;border:3px solid #111;border-radius:6px;padding:0;cursor:pointer;text-align:left;font:inherit;color:inherit;transition:transform .2s}
.card:hover,.card:focus-visible{transform:translateY(-4px) rotate(-.6deg);outline:none}
.card img{display:block;width:100%;aspect-ratio:1;border-bottom:3px solid #111}
.card .l{padding:10px 12px;display:flex;gap:10px;align-items:center}
.num{flex:none;width:28px;height:28px;border-radius:50%;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:500;font-size:14px}
.card b{display:block;font-weight:500;font-size:16px}
.card span.k{font-size:12px;color:#555}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;pointer-events:none;transition:opacity .25s}
.ov.o{opacity:1;pointer-events:auto}
.pn{background:#fff;border:3px solid #111;border-radius:6px;max-width:820px;width:100%;max-height:92vh;overflow:auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);transform:scale(.85);transition:transform .3s}
.ov.o .pn{transform:scale(1)}
.pn img{width:100%;aspect-ratio:1;border-right:3px solid #111;display:block}
.tx{padding:22px}
.tx h2{margin:0 0 2px;font-size:24px;font-weight:500}
.tx .k{color:#555;font-size:13px;margin:0 0 14px}
.tx p{font-size:15px;line-height:1.6;margin:0 0 10px}
.soc{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:8px 16px 40px}.so{display:block;width:max-content;background:#fff;color:#111;border:3px solid #111;border-radius:6px;padding:10px 18px;font-weight:500;text-decoration:none;font-size:15px}.so:hover{transform:translateY(-3px)}.x{float:right;background:#111;color:#fff;border:0;border-radius:4px;width:32px;height:32px;font-size:18px;cursor:pointer}
@media(max-width:600px){.pn{grid-template-columns:1fr}.pn img{border-right:0;border-bottom:3px solid #111}}
@media(max-width:600px){
body{background-attachment:scroll;min-height:100dvh;overflow-x:hidden}
header{padding:28px 12px 4px}
h1{font-size:24px}
h1 em{right:-6px;top:-26px;font-size:11px}
header p{font-size:13px}
.grid{gap:12px;margin:18px auto;padding:0 12px}
.card{border-width:2px}
.card img{border-bottom-width:2px}
.card .l{padding:8px;gap:8px}
.card b{font-size:14px}
.card span.k{font-size:11px}
.num{width:24px;height:24px;font-size:12px}
.ov{align-items:flex-end;padding:0}
.pn{border-radius:12px 12px 0 0;max-height:92dvh;border-width:2px;border-bottom:0}
.pn img{max-height:38dvh;width:auto;max-width:100%;margin:0 auto;border-bottom:0!important;border-right:0!important}
.tx{padding:16px 16px 28px}
.tx h2{font-size:21px}
.tx p{font-size:15px}
.x{width:40px;height:40px}
.so{padding:12px 20px}
.soc{margin:8px 12px 32px}
}
.card,.so,.x{-webkit-tap-highlight-color:transparent}
</style></head><body>
<header><h1>Antre en Ligne<em>jeu à tester !</em></h1><p>La Numériteam · La Co'Cotte · Touche une case pour l'ouvrir</p></header>
<div class="grid" id="g"></div>
<div class="soc"><a class="so" href="https://www.instagram.com/la_numeriteam_" target="_blank" rel="noopener">Instagram →</a><a class="so" href="https://www.tiktok.com/@la.numeriteam" target="_blank" rel="noopener">TikTok →</a></div>
<div class="ov" id="ov" role="dialog" aria-modal="true"><div class="pn"><img id="pi" alt=""><div class="tx"><button class="x" id="cl" aria-label="Fermer">×</button><h2 id="pt"></h2><p class="k" id="pk"></p><div id="pb"></div></div></div></div>
<script>
/* MODIFIER LE CONTENU ICI : chaque carte a un numéro (n), un titre (t), un sous-titre (k), une image (img) et des paragraphes (lore). */
const C=[
  {
    "n": 1,
    "t": "Le Contexte",
    "k": "Brief · les jeunes",
    "lore": [
      "Lancé en octobre 2025, un groupe de jeunes de 18 à 26 ans, accompagné par la Mission Locale et le PLIE du Vermandois, avait pour défi de créer un jeu de A à Z.",
      "12 jeunes majeurs de 18 à 26 ans, sans expérience concrète ni spécifique, se réunissent autour d'un même défi : faire un jeu de A à Z, sans connaissance au départ.",
      "Après plusieurs temps de réflexion, le groupe décide de créer un jeu de plateau numérique pédagogique, avec une vraie envie : permettre à tous les publics d'apprendre le numérique de façon ludique et simple, par le biais de questions et de mises en pratique.",
      "Pour s'organiser, chacun prend un rôle : Game Dev, Game Artiste, Manager Réseaux...",
      "Chaque nouveau domaine est une découverte, jusqu'à la création des comptes sur les réseaux sociaux."
    ],
    "img": "images/i1.png"
  },
  {
    "n": 2,
    "t": "Le jeu",
    "k": "Plateau · matériel · Tiers-Lieu",
    "lore": [
      "À première vue, un jeu de société classique avec des pions personnalisés, deux dés et un chemin à suivre, en 3 phases.",
      "La vraie spécificité du jeu est l'intégration d'un QR code, qui permet d'accéder à une vraie interface où les joueurs s'affrontent par le biais de questions sur le numérique, avec 4 modules modélisés en 3D. Le niveau de difficulté est choisi en amont par le maître du jeu.",
      "Des cases Vrai ou Faux testent la culture web de tous.",
      "Entièrement réalisé avec les outils du FabLab disponibles dans le Tiers-Lieu."
    ],
    "img": "images/i2.png"
  },
  {
    "n": 3,
    "t": "Le twist",
    "k": "Boss final · équipe · futur",
    "lore": [
      "Les 4 modules en poche, le joueur est téléporté dans l'Antre du boss de fin, incarné par l'animateur du jeu.",
      "Il le défie seul ou à plusieurs : une série finale de questions, à retenir et à répéter d'une traite. S'il y arrive, c'est gagné. Sinon, il attend un autre joueur et coopère pour affronter le boss.",
      "Pendant la partie, les points gagnés ou perdus servent aux Appels à l'aide entre participants.",
      "Côté équipe, la Numériteam a réuni des passionnés qui se pensaient seuls, et en a fait une vraie équipe et une vraie amitié.",
      "Côté futur, le jeu est rejouable : base simple et modules interchangeables, pour passer du numérique au code de la route, aux maths, ou à tout autre domaine."
    ],
    "img": "images/i3.png"
  },
  {
    "n": 4,
    "t": "L'après",
    "k": "Côté pro",
    "lore": [
      "Le projet a lancé un vrai mouvement d'envol professionnel : la quasi-totalité des participants sont entrés depuis en emploi, en stage, en service civique ou en insertion.",
      "Ce projet a permis aux jeunes, en plus de l'accompagnement de la Mission Locale et du PLIE, de vivre la réalisation d'un projet du début à la fin, en expérimentant le travail d'équipe, la prise de décision, l'écoute et le dialogue dans un cadre défini.",
      "C'est un atout pour la suite, pour eux, dans leur entrée professionnelle."
    ],
    "img": "images/i4.png"
  }
];
const g=document.getElementById('g'),ov=document.getElementById('ov');
C.forEach((c,i)=>{const b=document.createElement('button');b.className='card';b.innerHTML=`<img src="${c.img}" alt=""><div class="l"><span class="num">${c.n}</span><div><b>${c.t}</b><span class="k">${c.k}</span></div></div>`;b.onclick=()=>open_(i);g.appendChild(b)});
function open_(i){const c=C[i];pi.src=c.img;pt.textContent=c.n+'. '+c.t;pk.textContent=c.k;pb.innerHTML=c.lore.map(t=>`<p>${t}</p>`).join('');ov.classList.add('o');document.body.style.overflow='hidden';cl.focus()}
function close_(){ov.classList.remove('o');document.body.style.overflow=''}
cl.onclick=close_;ov.onclick=e=>{if(e.target===ov)close_()};document.onkeydown=e=>{if(e.key==='Escape')close_()};
</script></body></html>
